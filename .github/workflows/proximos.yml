name: Proximos Partidos

on:
  schedule:
    # Dos veces por dia, no una. El cron de GitHub es best-effort: descarta ~1 de
    # cada 3 disparos y se atrasa hasta 3 horas (medido: se declaro 10:00 UTC y
    # corrio 11:18, 12:01, 12:03 y 12:56). Con un solo disparo, un salto dejaba la
    # pestana 48 horas vieja; con dos, un salto se cubre solo.
    # 09:00 UTC = 04:00 hora Peru (antes del primer partido del dia).
    # 21:00 UTC = 16:00 hora Peru (agarra las reprogramaciones de la tarde).
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  proximos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar pestana Proximos
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python proximos.py
