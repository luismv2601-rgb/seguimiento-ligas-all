name: Actualizar Seguimiento

on:
  schedule:
    # Respaldo de Cloud Scheduler, que es el disparador principal. Se limita a la
    # misma ventana: 09:00 a 23:00 hora Peru, o sea 14:00 a 04:00 UTC. Entre las
    # 00:00 y las 08:00 hora Peru no arranca ningun partido, asi que correr ahi
    # era gastar llamadas a la API para no encontrar nada.
    # 14=09:00, 16=11:00, 18=13:00, 20=15:00, 22=17:00, 00=19:00, 02=21:00, 04=23:00.
    - cron: '0 0,2,4,14,16,18,20,22 * * *'
  workflow_dispatch:

# Dos corridas en paralelo duplican partidos: cada una lee los fixture_id ya
# cargados al arrancar, asi que si la segunda empieza antes de que la primera
# escriba, las dos ven el mismo partido como nuevo y las dos lo agregan. Paso el
# 2026-08-02, cuando el cron de GitHub cayo a 52 segundos del disparo de Cloud
# Scheduler (16:59:29 y 17:00:21 UTC): 20 partidos duplicados.
# cancel-in-progress en false a proposito: la segunda espera y arranca despues,
# en vez de matar a la primera a mitad de escritura.
concurrency:
  group: actualizar-seguimiento
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar actualizacion
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python actualizar.py
