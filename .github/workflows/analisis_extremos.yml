name: Analisis Extremos

on:
  schedule:
    # Una vez por dia alcanza: solo relee Partidos y Analisis del Sheet,
    # no consume API-Football. 10:30 UTC = 05:30 hora Peru, media hora
    # despues de proximos.yml para no pisarlo.
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar pestana Analisis 2
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python analisis_extremos.py
